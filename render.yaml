# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bibliotech-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL        # chaine de connexion Supabase (Session pooler)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AMENDE_PAR_JOUR
        value: "0.5"
